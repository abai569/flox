
name: Build and Push Images

env:
  VERSION: "2.0.7-beta"  # 分支推送时使用的默认版本
  REGISTRY: ghcr.io

on:
  push:
    tags:
      - '[0-9]*'  # 匹配 2.0.8, 2.0.8-beta 等格式

jobs:
  check-version:
    name: Check Version and Decide Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
      should_build_gost: ${{ steps.version.outputs.should_build_gost }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      docker_platforms: ${{ steps.version.outputs.docker_platforms }}
      image_owner: ${{ steps.version.outputs.image_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and build strategy
        id: version
        run: |
          # 镜像 owner 需要小写
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_owner=$IMAGE_OWNER" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag 触发：直接使用 tag 名作为版本，全量构建
            VERSION="${{ github.ref_name }}"
            echo "🏷️ Tag trigger detected: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "should_build_gost=true" >> $GITHUB_OUTPUT
          else
            # 分支触发：使用 env.VERSION，检查是否需要构建
            VERSION="${{ env.VERSION }}"
            echo "🌿 Branch trigger detected, using version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT

            # 检查 tag 是否已存在
            if git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "Tag $VERSION already exists"
              echo "should_build=false" >> $GITHUB_OUTPUT

              # 检查 go-gost 目录是否有变化
              TAG_COMMIT=$(git rev-list -n 1 "$VERSION")
              if git diff --quiet --ignore-all-space --ignore-blank-lines $TAG_COMMIT HEAD -- go-gost/ 2>/dev/null; then
                echo "✅ GOST files unchanged since tag"
                echo "should_build_gost=false" >> $GITHUB_OUTPUT
              else
                echo "🔄 Detected changes in go-gost directory"
                git diff --stat $TAG_COMMIT HEAD -- go-gost/ || true
                echo "should_build_gost=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "Tag $VERSION does not exist, will build all components"
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "should_build_gost=true" >> $GITHUB_OUTPUT
            fi
          fi

          # 检查是否为预发布版本（含 dev/beta/alpha/rc 后缀）
          IS_PRERELEASE=false
          if [[ "$VERSION" =~ -(dev|beta|alpha|rc) ]]; then
            IS_PRERELEASE=true
            echo "⚠️ Pre-release version detected: $VERSION"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "docker_platforms=linux/amd64" >> $GITHUB_OUTPUT
            echo "Development release: Docker images will only target linux/amd64"
          else
            echo "docker_platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
            echo "Stable release: Docker images will target linux/amd64 and linux/arm64"
          fi

  build-gost:
    name: Build & Compress GOST Binary
    needs: check-version
    if: needs.check-version.outputs.should_build_gost == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go-gost/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install UPX
        run: |
          wget -q https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: Checkout closed repo
        uses: actions/checkout@v4
        with:
          repository: abai569/flox-closed
          path: closed
          token: ${{ secrets.CLOSED_REPO_PAT }}

      - name: Merge closed source
        shell: pwsh
        run: ./closed/scripts/merge-closed.ps1 -RootDir ${{ github.workspace }}

      - name: Build GOST binary (AMD64)
        working-directory: ./go-gost
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ needs.check-version.outputs.version }}" -o gost-amd64

      - name: Build GOST binary (ARM64)
        working-directory: ./go-gost
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ needs.check-version.outputs.version }}" -o gost-arm64

      - name: Compress with UPX
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost-amd64
          upx --best --lzma gost-arm64

      - name: Generate SHA256 checksums
        working-directory: ./go-gost
        run: |
          sha256sum gost-amd64 > gost-amd64.sha256
          sha256sum gost-arm64 > gost-arm64.sha256

      - name: Upload GOST AMD64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./go-gost/gost-amd64

      - name: Upload GOST ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./go-gost/gost-arm64

      - name: Upload GOST AMD64 checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-checksum-amd64
          path: ./go-gost/gost-amd64.sha256

      - name: Upload GOST ARM64 checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-checksum-arm64
          path: ./go-gost/gost-arm64.sha256

  build-vite:
    name: Build & Push Vite Frontend
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout closed repo
        uses: actions/checkout@v4
        with:
          repository: abai569/flox-closed
          path: closed
          token: ${{ secrets.CLOSED_REPO_PAT }}

      - name: Merge closed source
        shell: pwsh
        run: ./closed/scripts/merge-closed.ps1 -RootDir ${{ github.workspace }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build args
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          {
            echo "VITE_GITHUB_REPO=https://github.com/${{ github.repository }}"
            echo "VITE_APP_VERSION=$VERSION"
          } > ./vite-frontend/.env.production

      - name: Build and push Vite Docker images
        uses: docker/build-push-action@v5
        with:
          context: ./vite-frontend
          platforms: ${{ needs.check-version.outputs.docker_platforms }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ needs.check-version.outputs.image_owner }}/flox-svc-frontend:latest
            ${{ env.REGISTRY }}/${{ needs.check-version.outputs.image_owner }}/flox-svc-frontend:${{ needs.check-version.outputs.version }}

  build-go-backend:
    name: Build & Push Go Backend
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout closed repo
        uses: actions/checkout@v4
        with:
          repository: abai569/flox-closed
          path: closed
          token: ${{ secrets.CLOSED_REPO_PAT }}

      - name: Merge closed source
        shell: pwsh
        run: ./closed/scripts/merge-closed.ps1 -RootDir ${{ github.workspace }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache Go dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-backend-${{ hashFiles('go-backend/go.sum') }}
          restore-keys: ${{ runner.os }}-go-backend-

      - name: Download dependencies
        working-directory: ./go-backend
        run: go mod download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Go backend Docker images
        uses: docker/build-push-action@v5
        with:
          context: ./go-backend
          platforms: ${{ needs.check-version.outputs.docker_platforms }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ needs.check-version.outputs.image_owner }}/flox-svc-backend:latest
            ${{ env.REGISTRY }}/${{ needs.check-version.outputs.image_owner }}/flox-svc-backend:${{ needs.check-version.outputs.version }}

  create-release:
    name: Create Release (Tag Only)
    needs: [check-version, build-gost, build-vite, build-go-backend]
    if: needs.check-version.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download GOST AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./artifacts/amd64

      - name: Download GOST ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./artifacts/arm64

      - name: Download GOST AMD64 checksum
        uses: actions/download-artifact@v4
        with:
          name: gost-checksum-amd64
          path: ./artifacts/

      - name: Download GOST ARM64 checksum
        uses: actions/download-artifact@v4
        with:
          name: gost-checksum-arm64
          path: ./artifacts/

      - name: Prepare release files

        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          OWNER="${{ needs.check-version.outputs.image_owner }}"
          REPO="${{ github.repository }}"

          # 移动二进制文件
          mv ./artifacts/amd64/gost-amd64 ./artifacts/gost-amd64
          mv ./artifacts/arm64/gost-arm64 ./artifacts/gost-arm64

          # 复制并修改 docker-compose 文件
          cp docker-compose-v4.yml ./artifacts/docker-compose-v4.yml
          cp docker-compose-v6.yml ./artifacts/docker-compose-v6.yml

          # 替换镜像地址为 GHCR
          sed -i "s|image: .*flox-svc-backend:[^[:space:]]*|image: ${{ env.REGISTRY }}/${OWNER}/flox-svc-backend:${VERSION}|g" ./artifacts/docker-compose-v4.yml
          sed -i "s|image: .*flox-svc-frontend:[^[:space:]]*|image: ${{ env.REGISTRY }}/${OWNER}/flox-svc-frontend:${VERSION}|g" ./artifacts/docker-compose-v4.yml
          sed -i "s|image: .*flox-svc-backend:[^[:space:]]*|image: ${{ env.REGISTRY }}/${OWNER}/flox-svc-backend:${VERSION}|g" ./artifacts/docker-compose-v6.yml
          sed -i "s|image: .*flox-svc-frontend:[^[:space:]]*|image: ${{ env.REGISTRY }}/${OWNER}/flox-svc-frontend:${VERSION}|g" ./artifacts/docker-compose-v6.yml

          # 构建离线包（amd64）
          echo "📦 构建离线包 (amd64)..."
          mkdir -p ./artifacts/offline-amd64
          cp ./artifacts/gost-amd64 ./artifacts/offline-amd64/flox_agent
          cp ./install.sh ./artifacts/offline-amd64/offline.sh
          cd ./artifacts/offline-amd64 && zip -r ../offline-amd64.zip . && cd ../..

          # 构建离线包（arm64）
          echo "📦 构建离线包 (arm64)..."
          mkdir -p ./artifacts/offline-arm64
          cp ./artifacts/gost-arm64 ./artifacts/offline-arm64/flox_agent
          cp ./install.sh ./artifacts/offline-arm64/offline.sh
          cd ./artifacts/offline-arm64 && zip -r ../offline-arm64.zip . && cd ../..

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          OWNER="${{ needs.check-version.outputs.image_owner }}"
          REPO="${{ github.repository }}"

          # 判断是否为预发布版本（含 dev/beta/alpha/rc 后缀）
          IS_PRERELEASE=false
          if [[ "$VERSION" =~ -(dev|beta|alpha|rc) ]]; then
            IS_PRERELEASE=true
          fi

          # 获取 commit 信息
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ai")

          # 创建 release
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = true ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${VERSION}" \
            $PRERELEASE_FLAG \
            --title "Release ${VERSION}" \
            --notes "## 📝 Release Information

          - **Version**: ${VERSION}
          - **Commit**: [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **Author**: ${COMMIT_AUTHOR}
          - **Date**: ${COMMIT_DATE}
          - **Message**: ${COMMIT_MSG}

          ## 📦 Docker Images

          \`\`\`bash
          # Backend
          docker pull ${{ env.REGISTRY }}/${OWNER}/flox-svc-backend:${VERSION}

          # Frontend
          docker pull ${{ env.REGISTRY }}/${OWNER}/flox-svc-frontend:${VERSION}
          \`\`\`

          ## 🚀 Quick Install

          **Panel (安装此版本 ${VERSION}):**
          \`\`\`bash
          bash <(curl -L https://raw.githubusercontent.com/${{ github.repository }}/main/panel_install.sh) ${VERSION}
          \`\`\`

          **安装最新版面板:**
          \`\`\`bash
          bash <(curl -L https://raw.githubusercontent.com/${{ github.repository }}/main/panel_install.sh)
          \`\`\`" \
            --repo "${REPO}"

          # 上传所有文件到 release
          echo "📤 上传 GOST 二进制文件..."
          gh release upload "${VERSION}" ./artifacts/gost-amd64 --clobber --repo "${REPO}"
          gh release upload "${VERSION}" ./artifacts/gost-arm64 --clobber --repo "${REPO}"

          echo "📤 上传 GOST 校验文件..."
          gh release upload "${VERSION}" ./artifacts/gost-amd64.sha256 --clobber --repo "${REPO}"
          gh release upload "${VERSION}" ./artifacts/gost-arm64.sha256 --clobber --repo "${REPO}"

          echo "📤 上传 Docker Compose 配置文件..."
          gh release upload "${VERSION}" ./artifacts/docker-compose-v4.yml --clobber --repo "${REPO}"
          gh release upload "${VERSION}" ./artifacts/docker-compose-v6.yml --clobber --repo "${REPO}"

          echo "📤 上传离线包..."
          gh release upload "${VERSION}" ./artifacts/offline-amd64.zip --clobber --repo "${REPO}"
          gh release upload "${VERSION}" ./artifacts/offline-arm64.zip --clobber --repo "${REPO}"

          # 正式版设为 latest，预发布版不覆盖 latest
          if [ "$IS_PRERELEASE" = false ]; then
            RELEASE_ID=$(gh release view "${VERSION}" --repo "${REPO}" --json databaseId --jq '.databaseId')
            gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -f make_latest="true"
          fi
          echo "✅ Release ${VERSION} 创建完成"

  update-release-gost:
    name: Update GOST Binaries in Release
    needs: [check-version, build-gost]
    if: needs.check-version.outputs.is_tag == 'false' && needs.check-version.outputs.should_build == 'false' && needs.check-version.outputs.should_build_gost == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download GOST AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-amd64
          path: ./artifacts/amd64

      - name: Download GOST ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-arm64
          path: ./artifacts/arm64

      - name: Download GOST AMD64 checksum
        uses: actions/download-artifact@v4
        with:
          name: gost-checksum-amd64
          path: ./artifacts/

      - name: Download GOST ARM64 checksum
        uses: actions/download-artifact@v4
        with:
          name: gost-checksum-arm64
          path: ./artifacts/

      - name: Rename binaries
        run: |
          mv ./artifacts/amd64/gost-amd64 ./artifacts/gost-amd64
          mv ./artifacts/arm64/gost-arm64 ./artifacts/gost-arm64

      - name: Build offline packages
        run: |
          echo "📦 构建离线包 (amd64)..."
          mkdir -p ./artifacts/offline-amd64
          cp ./artifacts/gost-amd64 ./artifacts/offline-amd64/flox_agent
          cp ./install.sh ./artifacts/offline-amd64/offline.sh
          cd ./artifacts/offline-amd64 && zip -r ../offline-amd64.zip . && cd ../..

          echo "📦 构建离线包 (arm64)..."
          mkdir -p ./artifacts/offline-arm64
          cp ./artifacts/gost-arm64 ./artifacts/offline-arm64/flox_agent
          cp ./install.sh ./artifacts/offline-arm64/offline.sh
          cd ./artifacts/offline-arm64 && zip -r ../offline-arm64.zip . && cd ../..

      - name: Update GOST binaries in Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          REPO="${{ github.repository }}"

          echo "🔄 更新 Release ${VERSION} 中的 GOST 二进制文件..."

          gh release upload "${VERSION}" ./artifacts/gost-amd64 --clobber --repo "${REPO}"
          gh release upload "${VERSION}" ./artifacts/gost-arm64 --clobber --repo "${REPO}"

          echo "📤 上传 GOST 校验文件..."
          gh release upload "${VERSION}" ./artifacts/gost-amd64.sha256 --clobber --repo "${REPO}"
          gh release upload "${VERSION}" ./artifacts/gost-arm64.sha256 --clobber --repo "${REPO}"

          echo " 📤 上传离线包..."
          gh release upload "${VERSION}" ./artifacts/offline-amd64.zip --clobber --repo "${REPO}"
          gh release upload "${VERSION}" ./artifacts/offline-arm64.zip --clobber --repo "${REPO}"

          echo " ✅ GOST 二进制文件更新完成"

  sync-gost-mirror:
    name: Sync GOST to Mirror
    needs: [build-gost]
    if: needs.check-version.outputs.should_build_gost == 'true' && needs.check-version.outputs.is_prerelease == 'false'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Download GOST AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-amd64

      - name: Download GOST ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary-arm64

      - name: Sync to domestic mirror
        env:
          DOMESTIC_USER: ${{ secrets.DOMESTIC_USER }}
          DOMESTIC_PASS: ${{ secrets.DOMESTIC_PASS }}
          DOMESTIC_WEBDAV_URL: https://chfs.646321.xyz:8/webdav/flox
        run: |
          echo "⬆️  Syncing to domestic mirror (parallel)..."
          curl -s -u "${DOMESTIC_USER}:${DOMESTIC_PASS}" \
            -T gost-amd64 \
            "${DOMESTIC_WEBDAV_URL}/gost-amd64" &
          curl -s -u "${DOMESTIC_USER}:${DOMESTIC_PASS}" \
            -T gost-arm64 \
            "${DOMESTIC_WEBDAV_URL}/gost-arm64" &
          wait
          echo "✅ Sync complete"

  build-android:
    name: Build Android APK
    needs: [check-version, create-release]
    if: needs.check-version.outputs.is_tag == 'true' && needs.check-version.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vite-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Checkout closed repo
        uses: actions/checkout@v4
        with:
          repository: abai569/flox-closed
          path: closed
          token: ${{ secrets.CLOSED_REPO_PAT }}

      - name: Merge closed source
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./closed/scripts/merge-closed.ps1 -RootDir ${{ github.workspace }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ANDROID_VERSION="$(node -e "const fs=require('fs');const text=fs.readFileSync('../shared/versions.ts','utf8');const match=text.match(/ANDROID_APP_VERSION\\s*=\\s*['\\\"]v?([^'\\\"]+)['\\\"]/);if(!match)throw new Error('ANDROID_APP_VERSION not found');process.stdout.write(match[1]);")"
          echo "android_version=$ANDROID_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare build env
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "VITE_GITHUB_REPO=https://github.com/${{ github.repository }}" > .env.production
          echo "VITE_APP_VERSION=$VERSION" >> .env.production

      - name: Build web assets
        run: npx vite build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare Gradle wrapper
        run: chmod +x android/gradlew

      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            mkdir -p android/app/keystore
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
            echo "keystore_file=keystore/release.jks" >> "$GITHUB_OUTPUT"
            echo "keystore_password=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$ANDROID_KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$ANDROID_KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "keystore_type=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Android release signing secrets are incomplete; using fixed fallback keystore."
            echo "keystore_file=keystore/flox-fallback.jks" >> "$GITHUB_OUTPUT"
            echo "keystore_password=android" >> "$GITHUB_OUTPUT"
            echo "key_alias=androiddebugkey" >> "$GITHUB_OUTPUT"
            echo "key_password=android" >> "$GITHUB_OUTPUT"
            echo "keystore_type=PKCS12" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: vite-frontend/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.keystore_password }}
          ANDROID_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
          ANDROID_KEYSTORE_TYPE: ${{ steps.signing.outputs.keystore_type }}
          ANDROID_VERSION_NAME: ${{ needs.check-version.outputs.version }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/flox-android.apk"

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          REPO="${{ github.repository }}"
          gh release upload "${VERSION}" "dist/flox-android.apk" --clobber --repo "${REPO}"
          echo "✅ Android APK uploaded to release ${VERSION}"


